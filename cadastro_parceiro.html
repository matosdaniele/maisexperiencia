<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Cadastro de parceiro — Mais Experiência">
  <title>Quero ser parceiro — Mais Experiência</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app-page.css?v=35">
  <link rel="stylesheet" href="css/a11y-bar.css?v=14">
  <script src="js/site-config.js"></script>
  <script src="js/app-common.js?v=12"></script>
  <script src="js/analytics.js?v=4"></script>
</head>
<body>
  <main class="wrap">
    <a class="back-link" href="entrar.html">← Voltar</a>
    <h1>Quero ser parceiro</h1>
    <p class="lead">Preencha os dados abaixo. Analisaremos seu pedido e, se aprovado, enviaremos um e-mail para você criar sua senha e concluir o cadastro.</p>

    <div id="feedback" class="feedback" role="status" aria-live="polite" hidden></div>

    <form id="form-parceiro" novalidate>
      <div>
        <label for="empresa">Empresa ou organização</label>
        <input id="empresa" name="empresa" type="text" autocomplete="organization" required minlength="2">
      </div>
      <div>
        <label for="nome">Nome do responsável</label>
        <input id="nome" name="nome" type="text" autocomplete="name" required minlength="2">
      </div>
      <div>
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
      </div>
      <div>
        <label for="telefone">Telefone <span class="label-optional">(opcional)</span></label>
        <input id="telefone" name="telefone" type="tel" autocomplete="tel" inputmode="tel">
      </div>
      <div class="checkbox-row checkbox-row--consent">
        <input id="consentimento-dados" name="consentimentoDados" type="checkbox" required>
        <label for="consentimento-dados">
          Usaremos os dados da empresa e do responsável para analisar o pedido de parceria e comunicar o resultado. Você pode pedir a exclusão a qualquer momento. Para maiores detalhes consulte:
          <a class="link-inline" href="legal/termos-de-uso.html" target="_blank" rel="noopener">Termos de uso</a>,
          <a class="link-inline" href="legal/politica-de-privacidade.html" target="_blank" rel="noopener">Política de privacidade</a> e
          <a class="link-inline" href="legal/politica-seguranca-informacao.html" target="_blank" rel="noopener">Política de Segurança da Informação</a>.
        </label>
      </div>
      <button type="submit" class="btn" id="btn-enviar">Enviar pedido</button>
    </form>
  </main>

  <script>
    (function () {
      var apiBase = ME_APP.getApiBase();
      var form = document.getElementById("form-parceiro");
      var feedback = document.getElementById("feedback");
      var btn = document.getElementById("btn-enviar");

      ME_ANALYTICS.track("parceiro_cadastro_inicio", { page: "cadastro_parceiro" });

      function showFeedback(message, type) {
        feedback.hidden = false;
        feedback.textContent = message;
        feedback.className = "feedback feedback--" + type;
      }

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        feedback.hidden = true;

        var payload = {
          empresa: form.empresa.value.trim(),
          nome: form.nome.value.trim(),
          email: form.email.value.trim(),
          telefone: form.telefone.value.trim(),
          consentimentoDados: form["consentimentoDados"].checked,
        };

        btn.disabled = true;
        btn.textContent = "Enviando…";
        ME_ANALYTICS.track("parceiro_cadastro_submit", { page: "cadastro_parceiro" });

        fetch(apiBase + "/api/parceiros", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        })
          .then(function (response) {
            return response.json().then(function (data) {
              return { ok: response.ok, status: response.status, data: data };
            });
          })
          .then(function (result) {
            if (result.ok) {
              ME_ANALYTICS.track("parceiro_cadastro_sucesso", { page: "cadastro_parceiro" });
              form.reset();
              showFeedback(
                "Pedido enviado! Analisaremos e responderemos por e-mail em breve.",
                "ok"
              );
              return;
            }
            ME_ANALYTICS.track("parceiro_cadastro_erro", {
              page: "cadastro_parceiro",
              status: result.status,
            });
            showFeedback(result.data.error || "Não foi possível enviar o pedido.", "erro");
          })
          .catch(function () {
            ME_ANALYTICS.track("parceiro_cadastro_erro", { page: "cadastro_parceiro", motivo: "rede" });
            showFeedback("Não foi possível contatar a API. Tente novamente em instantes.", "erro");
          })
          .finally(function () {
            btn.disabled = false;
            btn.textContent = "Enviar pedido";
          });
      });
    })();
  </script>
  <script src="js/site-brand.js?v=2"></script>
  <script src="js/public-page-shell.js?v=3"></script>
  <script src="js/a11y-bar.js?v=1"></script>
</body>
</html>
