<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Pilar do parceiro — Mais Experiência">
  <title>Pilar — Mais Experiência</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app-page.css?v=35">
  <link rel="stylesheet" href="css/a11y-bar.css?v=14">
  <script src="js/site-config.js"></script>
  <script src="js/app-common.js?v=12"></script>
  <script src="js/parceiro-pilares.js"></script>
  <script src="js/analytics.js?v=4"></script>
</head>
<body>
  <main class="wrap">
    <a class="back-link" href="area_parceiro.html">← Voltar à área do parceiro</a>
    <h1 id="page-title">Pilar</h1>
    <p class="lead" id="page-lead">Escolha uma ação para continuar.</p>

    <div class="actions parceiro-pilar-hub-actions">
      <a class="btn" id="btn-publicar" href="area_parceiro.html">Publicar</a>
      <a class="btn btn-secondary" id="btn-publicacoes" href="area_parceiro.html">Minhas publicações</a>
    </div>
  </main>

  <script>
    (function () {
      var sessao = ME_APP.ensureParceiroSession();
      if (!sessao) return;

      var tipo = (ME_APP.getQueryParam("tipo") || "").trim().toLowerCase();
      var pilar = ME_PARCEIRO_PILAR.get(tipo);
      if (!pilar) {
        window.location.replace("area_parceiro.html");
        return;
      }

      document.getElementById("page-title").textContent = pilar.titulo;
      document.getElementById("page-lead").textContent = pilar.lead;
      document.title = pilar.titulo + " — Mais Experiência";

      document.getElementById("btn-publicar").href = pilar.publicar;
      document.getElementById("btn-publicacoes").href = pilar.publicacoes;

      ME_ANALYTICS.track("pilar_parceiro_visita", { page: "pilar_parceiro", tipo: tipo });
    })();
  </script>
  <script src="js/site-brand.js?v=2"></script>
  <script src="js/app-shell.js?v=23"></script>
  <script src="js/a11y-bar.js?v=1"></script>
</body>
</html>
