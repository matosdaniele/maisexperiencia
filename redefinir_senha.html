<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Criar nova senha — Mais Experiência">
  <title>Nova senha — Mais Experiência</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app-page.css?v=35">
  <link rel="stylesheet" href="css/a11y-bar.css?v=14">
  <script src="js/site-config.js"></script>
  <script src="js/app-common.js?v=12"></script>
  <script src="js/analytics.js?v=4"></script>
</head>
<body>
  <main class="wrap">
    <a class="back-link" id="back-link" href="entrar.html">← Voltar</a>
    <h1>Nova senha</h1>
    <p class="lead" id="lead">Escolha uma nova senha para a sua conta.</p>

    <div id="feedback" class="feedback" role="status" aria-live="polite" hidden></div>

    <div id="loading" class="card">A validar o seu link…</div>

    <form id="form-redefinir" novalidate hidden>
      <p class="field-hint field-hint--spaced-bottom" id="perfil-resumo"></p>
      <div>
        <label for="senha">Nova senha</label>
        <input id="senha" name="senha" type="password" autocomplete="new-password" required minlength="6">
        <p class="field-hint">Mínimo de 6 caracteres, cumprindo pelo menos 2 regras: conter letra, número ou caractere especial.</p>
      </div>
      <div>
        <label for="senha-confirma">Confirmar nova senha</label>
        <input id="senha-confirma" name="senhaConfirma" type="password" autocomplete="new-password" required minlength="6">
      </div>
      <button type="submit" class="btn" id="btn-salvar">Salvar nova senha</button>
    </form>
  </main>

  <script src="js/redefinir-senha.js?v=1"></script>
  <script src="js/site-brand.js?v=2"></script>
  <script src="js/public-page-shell.js?v=3"></script>
  <script src="js/a11y-bar.js?v=1"></script>
</body>
</html>
